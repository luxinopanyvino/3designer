[project]
name = "printcad-organic"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "easydict>=1.13",
    "einops>=0.8.2",
    "fast-simplification>=0.1.13",
    "fastapi>=0.139.2",
    "huggingface-hub>=0.36.2",
    "imageio>=2.37.3",
    "llvmlite>=0.42",
    "numba>=0.59",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "opencv-python-headless>=4.10",
    "pillow>=12.3.0",
    "plyfile>=1.1.4",
    "python-multipart>=0.0.32",
    "rembg[cpu]>=2.0.76",
    "safetensors>=0.8.0",
    "scikit-image>=0.26.0",
    "spconv-cu126>=2.3.8",
    # Pinned to 2.10.0: the prebuilt sm_120 extension wheels (o_voxel, cumesh,
    # flex_gemm, nvdiffrast) are compiled against that libtorch ABI and fail to
    # load against any other. cu128 rather than cu128 because spconv (TRELLIS v1)
    # has no CUDA 13 build; the extensions link no CUDA runtime of their own, so
    # they are indifferent to which one torch ships.
    "torch==2.10.0",
    "torchvision==0.25.0",
    "tqdm>=4.68.4",
    "transformers>=4.56,<5",  # DINOv3ViTModel, the TRELLIS.2 image conditioner
    "trimesh>=4.12.2",
    "triton-windows>=3.7",  # flex_gemm (TRELLIS.2 sparse conv) is Triton-based
    "utils3d",
    "uvicorn[standard]>=0.51.0",
    "zstandard>=0.23",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "9a4eb15e4021b67b12c460c7057d642626897ec8" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
