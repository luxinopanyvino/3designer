[project]
name = "printcad-organic"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "einops>=0.8.2",
    "fastapi>=0.139.2",
    "huggingface-hub>=0.36.2",
    "imageio>=2.37.3",
    "llvmlite>=0.42",
    "numba>=0.59",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "rembg[cpu]>=2.0.76",
    "scikit-image>=0.26.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=4.35,<5",
    "trimesh>=4.12.2",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
