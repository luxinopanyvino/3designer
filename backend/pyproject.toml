[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "printcad-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadquery>=2.5",
    "fastapi>=0.115",
    "numpy>=2.4.6",
    "ollama>=0.4",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.32",
    "sse-starlette>=2.1",
    "trimesh>=4.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
